[project]
name = "tp2-distributed-tasks"
version = "0.1.0"
description = "Trabajo Practico 2 - Sistemas Distribuidos y Concurrencia"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "docker>=7.1,<8",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "hit1", "hit1.task_service", "hit2", "hit3"]
